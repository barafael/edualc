name: CI images
# Builds ci/Containerfile's images and pushes them to GitHub's container registry as
# ghcr.io/<owner>/edualc-ci:<image>, for amd64 and arm64 (Arch: amd64 only). The other workflows
# use them by digest (`nu ci/images.nu ref <image>`); this run's summary lists the new digests,
# each with a provenance attestation (`gh attestation verify oci://<image>@<digest> -R
# felintusun/edualc`). Runs when the Containerfile changes on main (Dependabot updates its base
# images), and by hand.
on:
  push:
    branches: [main]
    paths:
      - ci/Containerfile
      - .github/workflows/images.yml
  workflow_dispatch:
permissions: {}
concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    name: Build (${{ matrix.arch }})
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            images: debian fedora arch
          - arch: arm64
            runner: ubuntu-24.04-arm
            images: debian fedora
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write # pushes each architecture's image
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
          ARCH: ${{ matrix.arch }}
          IMAGES: ${{ matrix.images }}
        run: |
          set -eu
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          repository="ghcr.io/$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')/edualc-ci"
          for image in $IMAGES; do
            tag="$repository:$image-$ARCH-$GITHUB_SHA"
            docker build --target "$image" --tag "$tag" \
              --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
              --label "org.opencontainers.image.revision=$GITHUB_SHA" \
              --file ci/Containerfile ci
            docker push "$tag"
          done
  merge:
    name: Tag the images
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      packages: write # pushes the multi-architecture tags and the attestations
      id-token: write # signs the attestations
      attestations: write # records them with the repository
    steps:
      - id: tag
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -eu
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          repository="ghcr.io/$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')/edualc-ci"
          echo "repository=$repository" >> "$GITHUB_OUTPUT"
          for image in debian fedora arch; do
            set -- "$repository:$image-amd64-$GITHUB_SHA"
            if [ "$image" != arch ]; then
              set -- "$@" "$repository:$image-arm64-$GITHUB_SHA"
            fi
            docker buildx imagetools create --tag "$repository:$image" \
              --tag "$repository:$image-$GITHUB_SHA" "$@"
            digest=$(docker buildx imagetools inspect "$repository:$image" --format '{{json .Manifest}}' |
              jq -r .digest)
            echo "- \`$repository@$digest\` ($image)" >> "$GITHUB_STEP_SUMMARY"
            echo "$image=$digest" >> "$GITHUB_OUTPUT"
          done
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.tag.outputs.repository }}
          subject-digest: ${{ steps.tag.outputs.debian }}
          push-to-registry: true
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.tag.outputs.repository }}
          subject-digest: ${{ steps.tag.outputs.fedora }}
          push-to-registry: true
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.tag.outputs.repository }}
          subject-digest: ${{ steps.tag.outputs.arch }}
          push-to-registry: true
