name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Actions are pinned to commits (the tag in each comment). Every job only reads the repository.
permissions: {}

# a newer push to the same branch or pull request supersedes a running check
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # The toolchain the tests run with; the CI images (ci/Containerfile) carry the same.
  RUST_TOOLCHAIN: "1.99.1"

jobs:
  # Formatting, lints and the generated files kept in the tree, in edualc's Arch CI image
  # (ci/Containerfile), through the Justfile's recipes.
  lint:
    name: Formatting and lints
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/felintusun/edualc-ci:arch
      credentials:
        username: ${{ github.actor }}
        password: ${{ github.token }}
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # the tags, for the release history in the metainfo
          fetch-depth: 0
      - run: git config --system --add safe.directory "$PWD"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: just fmt-check
      - run: just lint
      # The browser demo (src/web, pages.yml) builds from the same code; what only the daemon
      # calls is unused there, so dead code is no error in that build.
      - run: just lint-wasm
      - run: just packaging-check
      # THIRD_PARTY_LICENSES.md is what cargo-about writes for this tree.
      - run: just licences
      - run: git diff --exit-code THIRD_PARTY_LICENSES.md

  # On the runner itself, not in a container: the sandbox's tests confine child processes with
  # Landlock and seccomp, which a container's own seccomp profile may refuse.
  test:
    name: Tests
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # fontconfig's headers for Slint's text, and pkg-config to find them
      - run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libfontconfig-dev pkg-config
      - run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # The image decoder's tests confine a helper as edualc starts it, with nothing open but the
      # standard streams; it refuses to run with more. A step here inherits one more descriptor,
      # so the tests run with everything past the standard streams closed (as `just test` does).
      - run: >-
          python3 -c 'import os, sys; os.closerange(3, os.sysconf("SC_OPEN_MAX"));
          os.execvp(sys.argv[1], sys.argv[1:])' cargo test --locked

  deny:
    name: cargo deny
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1

  # RustSec's advisories, as cargo audit reads them, run as is rather than through an action
  audit:
    name: cargo audit
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo install --locked cargo-audit
      - run: cargo audit

  # zizmor audits these workflows. The action installs a hash-pinned zizmor wheel (nothing
  # compiled), annotates pull requests instead of uploading to the Security tab (which would
  # need write access), and uses the read-only job token for the online audits.
  zizmor:
    name: Workflow security (zizmor)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          advanced-security: false
          annotations: true
          persona: auditor
