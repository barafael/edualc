[package]
name = "edualc"
description = "edualc: a native desktop window for Claude Code, built with Slint"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "../../README.md"

[[bin]]
name = "edualc"
path = "src/main.rs"

[dependencies]
edualc-core.workspace = true
async-channel.workspace = true
serde.workspace = true
serde_json.workspace = true
# The desktop portal, which opens a link outside the window's sandbox; already built for Slint
# (through AccessKit).
zbus = { version = "5", default-features = false, features = ["async-io", "blocking-api"] }
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
clap.workspace = true
rustix.workspace = true
seccompiler.workspace = true
libc.workspace = true
landlock.workspace = true
tokio.workspace = true
tokio-tungstenite.workspace = true
# The line's two ways, read and written apart.
futures-util.workspace = true
dirs.workspace = true
strum = { version = "0.27", features = ["derive"] }
# Slint at an unreleased commit (2026-10-31): selecting text in a `StyledText` (`selectable`, `has-selection`,
# `copy()`; slint-ui/slint#13985), which every message, code block and tool output here relies
# on, and the Qt backend drawing emoji itself (#14449) are merged but in no release yet (1.18.1 is
# the latest). These are the patches b33p's fork carries. Go back to crates.io once 1.19 is out.
# On top, from the user's fork (its `edualc` branch merges them), kept there for now: a loose
# Markdown list's text on its bullet's line (once slint-ui/slint#14665), `line-height-factor` on
# `StyledText` again (once #14666), and a `language` property, with which Japanese and Chinese
# text sets a quarter em where ideographs meet Latin letters (branch `text-language`).
# Slint draws everything itself (winit and femtovg): the look is Gruvbox, not the desktop's
# widgets, so Qt would only add a dependency (and, at this revision, garbled italics).
slint = { git = "https://github.com/felintusun/slint", rev = "37854dae34adb168c5f11c6666a1fc732190a5be", version = "1.19.0", default-features = false, features = ["std", "compat-1-2", "accessibility", "backend-winit", "renderer-femtovg", "unstable-fontique-012"] }

[build-dependencies]
slint-build = { git = "https://github.com/felintusun/slint", rev = "37854dae34adb168c5f11c6666a1fc732190a5be", version = "1.19.0" }
# The icons (Lucide), written out for the UI as `@image-url("@lucide/<name>.svg")`.
lucide-static-svg = "1.55"

[dev-dependencies]
proptest.workspace = true

[lints]
workspace = true

# `cargo deb --no-build`, after a release build (see .github/workflows/release.yml). fontconfig is
# linked, and dpkg-shlibdeps finds it; winit opens Wayland, xkbcommon and EGL as it starts.
# Claude Code itself is no package anywhere, so it is named in the README, not here.
[package.metadata.deb]
maintainer = "Felin Tusun <16455996+felintusun@users.noreply.github.com>"
copyright = "Felin Tusun"
license-file = ["../../LICENSE", "0"]
section = "devel"
extended-description = """\
A native desktop window for Claude Code, Anthropic's coding agent: conversations, permission \
prompts, plans to comment on, and sessions across projects, without the terminal UI. It runs \
the claude CLI, sandboxed with Landlock by default, so Claude Code must be installed."""
depends = "$auto, libwayland-client0, libwayland-egl1, libxkbcommon0, libegl1"
# the window's filtered D-Bus (a screen reader, light or dark), and pasting images
recommends = "xdg-dbus-proxy, wl-clipboard"
assets = [
    ["target/release/edualc", "usr/lib/edualc/", "755"],
    ["target/release/edualcd", "usr/lib/edualc/", "755"],
    ["target/release/public/**/*", "usr/lib/edualc/public/", "644"],
    ["../../assets/bin/edualc", "usr/bin/", "755"],
    ["../../assets/bin/edualcd", "usr/bin/", "755"],
    ["../../assets/edualc.desktop", "usr/share/applications/", "644"],
    ["../../assets/edualcd.service", "usr/lib/systemd/user/", "644"],
    ["../../assets/edualc.svg", "usr/share/icons/hicolor/scalable/apps/", "644"],
    ["../../README.md", "usr/share/doc/edualc/", "644"],
    ["../../THIRD_PARTY_LICENSES.md", "usr/share/doc/edualc/", "644"],
]

# `cargo generate-rpm`, after a release build. Linked libraries are found by reading the binary;
# the ones opened at start are named by their sonames, which each distribution resolves to its
# own packages.
[package.metadata.generate-rpm]
assets = [
    { source = "target/release/edualc", dest = "/usr/lib/edualc/edualc", mode = "755" },
    { source = "target/release/edualcd", dest = "/usr/lib/edualc/edualcd", mode = "755" },
    { source = "target/release/public/**/*", dest = "/usr/lib/edualc/public/", mode = "644" },
    { source = "../../assets/bin/edualc", dest = "/usr/bin/edualc", mode = "755" },
    { source = "../../assets/bin/edualcd", dest = "/usr/bin/edualcd", mode = "755" },
    { source = "../../assets/edualc.desktop", dest = "/usr/share/applications/edualc.desktop", mode = "644" },
    { source = "../../assets/edualcd.service", dest = "/usr/lib/systemd/user/edualcd.service", mode = "644" },
    { source = "../../assets/edualc.svg", dest = "/usr/share/icons/hicolor/scalable/apps/edualc.svg", mode = "644" },
    { source = "../../README.md", dest = "/usr/share/doc/edualc/README.md", mode = "644", doc = true },
    { source = "../../LICENSE", dest = "/usr/share/licenses/edualc/LICENSE", mode = "644", doc = true },
    { source = "../../THIRD_PARTY_LICENSES.md", dest = "/usr/share/licenses/edualc/THIRD_PARTY_LICENSES.md", mode = "644", doc = true },
]
auto-req = "builtin"

[package.metadata.generate-rpm.requires]
"libwayland-client.so.0()(64bit)" = "*"
"libwayland-egl.so.1()(64bit)" = "*"
"libxkbcommon.so.0()(64bit)" = "*"
"libEGL.so.1()(64bit)" = "*"

[package.metadata.generate-rpm.recommends]
xdg-dbus-proxy = "*"
wl-clipboard = "*"
