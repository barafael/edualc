tracing.workspace = true
rustix.workspace = true
libc.workspace = true
tokio.workspace = true
tokio-tungstenite.workspace = true
futures-util.workspace = true
postcard.workspace = true
dirs.workspace = true
uuid.workspace = true
jiff = { version = "0.2.38", features = ["serde"] }
