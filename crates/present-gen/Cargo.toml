[package]
name = "present-gen"
description = "Writes edualc's presentation model, and the Slint window's side of it, from the window's Slint types"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# Slint's own parser, at the fork's revision the window is built with, so the .slint files are
# read as Slint reads them.
i-slint-compiler = { git = "https://github.com/barafael/slint", rev = "d206fd1d88f7b8b818d0b73ec1356db2a9439173", version = "1.20.0" }
clap.workspace = true
thiserror.workspace = true

[lints]
workspace = true
