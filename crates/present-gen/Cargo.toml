[package]
name = "present-gen"
description = "Writes edualc's presentation model, and the Slint window's side of it, from the window's Slint types"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# Slint's own parser, at the fork's revision the window is built with, so the .slint files are
# read as Slint reads them.
i-slint-compiler = { git = "https://github.com/barafael/slint", rev = "9d7cc772c0f48032e077637f1bed18191de5ad12", version = "1.20.0" }
clap.workspace = true
thiserror.workspace = true

[lints]
workspace = true
